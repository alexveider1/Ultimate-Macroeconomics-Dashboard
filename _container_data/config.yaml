shared:
  data_root: _container_data
  env_file: _container_data/.env
  database_schema: database_schema.yaml
  world_bank_download_config: _configs/world_bank_download_config.json
  news_download_config: _configs/news_download_config.json
  yahoo_download_config: _configs/yahoo_download_config.json
  binance_download_config: _configs/binance_download_config.json
  fred_download_config: _configs/fred_download_config.json
  eurostat_download_config: _configs/eurostat_download_config.json
  actually_relevant_download_config: _configs/actually_relevant_download_config.json
  world_bank_articles_download_config: _configs/world_bank_articles_download_config.json
  nuts_geojson: _configs/nuts_level2_2021.geojson
  eurostat_nuts_level: 2
  openai_base_url: https://api.openai.com/v1
  openai_llm_model: gpt-5.4
  openai_llm_model_fast: gpt-5.4-mini
  openai_embedding_model: openai/text-embedding-3-small
  openai_embedding_model_max_tokens: 8192
  openai_embedding_model_dimensions: 1536
  # News RAG chunking (webhose + Actually Relevant + World Bank documents). Long
  # articles are split into overlapping token windows of `news_chunk_size_tokens`
  # (advancing by size - overlap) instead of being truncated to the embedding
  # limit, so no article text is lost. One Qdrant point per chunk.
  news_chunk_size_tokens: 800
  news_chunk_overlap_tokens: 100
services:
  app:
    host_sync_dir: _container_data/app
  agent:
    host_sync_dir: _container_data/agent
  downloader_general:
    host_sync_dir: _container_data/downloader_general
  downloader_extra:
    host_sync_dir: _container_data/downloader_extra
  forecaster:
    host_sync_dir: _container_data/forecaster
  python_sandbox:
    host_sync_dir: _container_data/python_sandbox
  clustering:
    host_sync_dir: _container_data/clustering
  bff:
    host_sync_dir: _container_data/bff
  backup:
    host_sync_dir: _container_data/backup
postgres:
  host: db
  port: 5432
qdrant:
  host: vector_db
  port: 6333
downloader_general:
  repo_url: https://github.com/Webhose/free-news-datasets.git
app:
  port: 8501
agent:
  port: 8000
forecaster:
  port: 8001
  ARIMA_AVAILABLE: true
  PROPHET_AVAILABLE: true
  CHRONOS_AVAILABLE: true
  CHRONOS_MODEL: amazon/chronos-t5-tiny
clustering:
  port: 8002
triton:
  # NVIDIA Triton Inference Server hosting every forecasting + clustering model
  # (python backend; CUDA where the model supports it, else CPU). GPU required.
  # Ports are internal to the compose network — the forecaster/clustering
  # adapters reach it over gRPC; nothing is published to the host.
  host: triton
  http_port: 8000
  grpc_port: 8001
  metrics_port: 8002
downloader_extra:
  port: 8003
python_sandbox:
  port: 8004
bff:
  # Read-only backend-for-frontend. Additive: the Streamlit app still reads
  # Postgres directly via connectorx until the Phase-6 frontend cutover.
  port: 8005
backup:
  # Cloud backups are OFF until you set enabled: true AND provide an rclone
  # remote (rclone_remote below + _container_data/backup/rclone.conf).
  enabled: false
  interval_minutes: 60
  run_on_start: true
  rclone_remote: "" # name of a remote in rclone.conf, e.g. "s3remote"; empty = uploads skipped
  rclone_path: macro-backups # destination dir/bucket path under the remote
  rclone_config_path: _container_data/rclone.conf # container path; host: _container_data/backup/rclone.conf
  retention_days: 7 # prune remote backups older than this (negative = keep forever)
  staging_dir: _container_data/staging
langfuse:
  # LLM observability / tracing (self-hosted Langfuse). Traces every agent
  # worker, tool, LLM + embedding call with tokens, latency and cost. The keys
  # live in .env (LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY); only these
  # non-secret knobs live here. When disabled — or when the keys are missing —
  # the SDK integration in agent / downloader_general / bff degrades to a no-op.
  enabled: true # master switch read by every Python service that emits traces
  host: http://langfuse_web:3000 # in-network URL the SDK POSTs traces to (UI is published on :3000)
  environment: dev # tag applied to every trace (dev / staging / production)
  sample_rate: 1.0 # fraction of traces to keep (1.0 = all)

monitoring:
  # External container + service monitoring (self-hosted, fully FOSS): an
  # OpenTelemetry Collector (per-container + host metrics via docker_stats /
  # hostmetrics) + blackbox_exporter (per-service HTTP/TCP health probes, target
  # lists in _container_data/prometheus/prometheus.yml) + Prometheus (scrape +
  # TSDB) + Grafana (dashboards, login required). Runs fully independent of the
  # dashboard; nothing in Python reads this block — it documents the ports the
  # same way postgres:/qdrant:/langfuse: do (ports are duplicated in
  # docker-compose.yaml; the two files are not auto-synced).
  enabled: true # master switch (informational; the stack is toggled via Compose)
  grafana:
    host: grafana # in-network hostname
    port: 3001 # UI (published to the host; container listens on 3000)
  prometheus:
    host: prometheus # in-network hostname
    port: 9092 # UI/API (published to the host; container listens on 9090)
  otel_collector:
    host: otel-collector # in-network hostname
    metrics_port: 8889 # Prometheus-format metrics endpoint (internal; scraped by Prometheus)
    otlp_grpc_port: 4317 # OTLP ingest (internal; idle until app traces/logs land)
    otlp_http_port: 4318 # OTLP ingest (internal; idle until app traces/logs land)
  blackbox_exporter:
    host: blackbox_exporter # in-network hostname
    port: 9115 # probe endpoint (internal; driven by Prometheus)

scheduler:
  # After the one-shot initial ingest, downloader_general stays alive and
  # refreshes each source on its OWN interval, appending only data newer than
  # what's already stored (incremental — never a full drop+recreate re-ingest).
  enabled: true # master switch for the whole scheduler
  run_on_start: false # false = wait one interval before the first update (the initial ingest just ran)
  sources:
    world_bank: { enabled: true, interval_minutes: 10080 } # weekly (annual data)
    yahoo: { enabled: true, interval_minutes: 1440 } # daily
    binance: { enabled: true, interval_minutes: 1440 } # daily
    fred: { enabled: true, interval_minutes: 10080 } # weekly
    eurostat: { enabled: true, interval_minutes: 10080 } # weekly
    news: { enabled: true, interval_minutes: 1440 } # daily (GitHub Webhose repo)
    actually_relevant: { enabled: true, interval_minutes: 720 } # twice daily
    world_bank_articles: { enabled: true, interval_minutes: 10080 } # weekly
