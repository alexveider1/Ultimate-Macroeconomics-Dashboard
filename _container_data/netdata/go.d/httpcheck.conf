# Netdata go.d httpcheck jobs — per-service HTTP health probes.
#
# Netdata runs on the Compose default bridge network, so every service is
# reachable by its container name + internal port (the same names/ports the
# stack uses internally). Each job charts request status, response time and
# whether the returned HTTP status is accepted (200 for all endpoints below).
#
# Bind-mounted read-only to /etc/netdata/go.d/httpcheck.conf (see the netdata
# service in docker-compose.yaml). Services with no HTTP endpoint
# (downloader_general, backup) are not listed here — their up/down state and
# CPU/RAM/mem still show in Netdata's per-container cgroup charts. TCP-only
# services (Postgres) live in portcheck.conf.

update_every: 10

jobs:
  - name: agent
    url: http://agent:8000/health
  - name: forecaster
    url: http://forecaster:8001/health
  - name: clustering
    url: http://clustering:8002/health
  - name: downloader_extra
    url: http://downloader_extra:8003/health
  - name: python_sandbox
    url: http://python_sandbox:8004/health
  - name: bff
    url: http://bff:8005/health
  - name: app
    url: http://app:8501/_stcore/health
  - name: triton
    url: http://triton:8000/v2/health/ready
  - name: qdrant
    url: http://vector_db:6333/readyz
  - name: langfuse_web
    url: http://langfuse_web:3000/api/public/health
