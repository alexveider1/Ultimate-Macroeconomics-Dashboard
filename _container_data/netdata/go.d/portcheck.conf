# Netdata go.d portcheck jobs — TCP health for services with no HTTP endpoint.
#
# Postgres has no HTTP health surface, so we TCP-probe its port. The Langfuse
# backing stores are internal-only and equally HTTP-less, so they get TCP
# probes too. Reachable by container name on the Compose default bridge network.
#
# Bind-mounted read-only to /etc/netdata/go.d/portcheck.conf.

update_every: 10

jobs:
  - name: postgres
    host: db
    ports:
      - 5432
  - name: langfuse_postgres
    host: langfuse_postgres
    ports:
      - 5432
  - name: langfuse_redis
    host: langfuse_redis
    ports:
      - 6379
  - name: langfuse_clickhouse
    host: langfuse_clickhouse
    ports:
      - 8123
  - name: langfuse_minio
    host: langfuse_minio
    ports:
      - 9000
