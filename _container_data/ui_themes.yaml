# Frontend theme config — single source of truth for ALL colours in the React
# SPA. Served by the BFF at GET /config/theme (active) and /config/themes (all),
# injected at runtime as CSS variables + a registered ECharts theme. Nothing is
# hard-coded in the frontend, so a palette swap here needs no rebuild.
#
# This is a NEW, frontend-native schema (deliberately NOT the Plotly-shaped
# `themes.yaml`, which still drives the legacy Streamlit app during migration).
#
# Schema (every token below is required — the frontend fails loud on a missing
# one, mirroring the old get_color KeyError):
#   chrome:   { background, surface, border, text, textMuted, primary, primaryText }
#   series:   { colorway: [>=1], sequential: [low, high], diverging: [low, mid, high] }
#   semantic: { positive, negative, referenceLine, selectedMarker, mapCoastline,
#               mapLand, sectors: { agriculture, manufacturing, services } }
#   charts:   { confidenceBandAlpha (0..1), gridLine, axisLine, tooltipBackground, tooltipText }
#   wordcloud:{ background, colors: [>=1] }   # explicit colours (not a matplotlib colormap name)

active: dark

themes:
  dark:
    label: Dark
    mode: dark
    fontFamily: "Inter, ui-sans-serif, system-ui, sans-serif"
    chrome:
      background: "#0e1117"
      surface: "#1e1e1e"
      border: "#2a2f3a"
      text: "#fafafa"
      textMuted: "#94a3b8"
      primary: "#10c8f1"
      primaryText: "#0e1117"
    series:
      colorway:
        - "#10c8f1"
        - "#ff6b6b"
        - "#ffd93d"
        - "#6bcf7f"
        - "#a685e2"
        - "#ff9f43"
        - "#4ecdc4"
        - "#f78fb3"
      sequential: ["#0e1117", "#10c8f1"]
      diverging: ["#60a5fa", "#1e293b", "#f87171"]
    semantic:
      positive: "#22c55e"
      negative: "#ef4444"
      referenceLine: "#94a3b8"
      selectedMarker: "#fde047"
      mapCoastline: "#7dd3fc"
      mapLand: "#1e293b"
      sectors:
        agriculture: "#34d399"
        manufacturing: "#f59e0b"
        services: "#60a5fa"
    charts:
      confidenceBandAlpha: 0.18
      gridLine: "#2a2f3a"
      axisLine: "#3a4150"
      tooltipBackground: "#1e1e1e"
      tooltipText: "#fafafa"
    wordcloud:
      background: "#0e1117"
      colors: ["#440154", "#3b528b", "#21918c", "#5ec962", "#fde725"]

  dark-blue:
    label: Dark Blue
    mode: dark
    fontFamily: "Inter, ui-sans-serif, system-ui, sans-serif"
    chrome:
      background: "#0b1c3a"
      surface: "#13294b"
      border: "#1e3a63"
      text: "#e2e8f0"
      textMuted: "#94a3b8"
      primary: "#3b82f6"
      primaryText: "#0b1c3a"
    series:
      colorway:
        - "#60a5fa"
        - "#38bdf8"
        - "#818cf8"
        - "#22d3ee"
        - "#a78bfa"
        - "#f472b6"
        - "#facc15"
        - "#34d399"
      sequential: ["#0b1c3a", "#60a5fa"]
      diverging: ["#38bdf8", "#1e293b", "#fb7185"]
    semantic:
      positive: "#4ade80"
      negative: "#f87171"
      referenceLine: "#64748b"
      selectedMarker: "#fde047"
      mapCoastline: "#38bdf8"
      mapLand: "#13294b"
      sectors:
        agriculture: "#22d3ee"
        manufacturing: "#a78bfa"
        services: "#60a5fa"
    charts:
      confidenceBandAlpha: 0.20
      gridLine: "#1e3a63"
      axisLine: "#2a4d7a"
      tooltipBackground: "#13294b"
      tooltipText: "#e2e8f0"
    wordcloud:
      background: "#0b1c3a"
      colors: ["#22d3ee", "#38bdf8", "#818cf8", "#a78bfa", "#f472b6"]

  light-green:
    label: Light Green
    mode: light
    fontFamily: "Inter, ui-sans-serif, system-ui, sans-serif"
    chrome:
      background: "#f7faf5"
      surface: "#e6f0e0"
      border: "#cddbc4"
      text: "#1f2937"
      textMuted: "#475569"
      primary: "#15803d"
      primaryText: "#ffffff"
    series:
      colorway:
        - "#15803d"
        - "#65a30d"
        - "#0d9488"
        - "#ca8a04"
        - "#b45309"
        - "#7c3aed"
        - "#be185d"
        - "#0369a1"
      sequential: ["#f7faf5", "#15803d"]
      diverging: ["#0369a1", "#f1f5f9", "#b91c1c"]
    semantic:
      positive: "#16a34a"
      negative: "#b91c1c"
      referenceLine: "#475569"
      selectedMarker: "#dc2626"
      mapCoastline: "#475569"
      mapLand: "#e2e8f0"
      sectors:
        agriculture: "#15803d"
        manufacturing: "#b45309"
        services: "#0369a1"
    charts:
      confidenceBandAlpha: 0.18
      gridLine: "#d7e3cf"
      axisLine: "#b6c7ab"
      tooltipBackground: "#ffffff"
      tooltipText: "#1f2937"
    wordcloud:
      background: "#f7faf5"
      colors: ["#c7e9c0", "#74c476", "#31a354", "#006d2c", "#00441b"]
