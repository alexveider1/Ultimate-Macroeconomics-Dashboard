[project]
name = "umd-backup"
version = "0.8.0"
description = "Scheduled cloud backups (Postgres pg_dump + Qdrant snapshots) via rclone."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.12.5",
    "pydantic-settings==2.14.2",
    "pyyaml==6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.15.14",
    "ty>=0.0.39",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --cov --cov-report=term-missing"

[tool.coverage.run]
source = ["."]
branch = true
omit = ["tests/*", ".venv/*", "**/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
