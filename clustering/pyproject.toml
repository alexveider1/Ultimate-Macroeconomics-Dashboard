[project]
name = "umd-clustering"
version = "0.8.0"
description = "FastAPI service exposing tabular clustering (KMeans, DBSCAN, Mean-Shift, HDBSCAN, Spectral, Hierarchical) with 2D/3D projection (t-SNE, PCA, UMAP, Kernel PCA)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "annotated-types==0.7.0",
    "anyio==4.13.0",
    "click==8.3.1",
    "colorama==0.4.6",
    "fastapi==0.135.2",
    "h11==0.16.0",
    "idna==3.11",
    "joblib==1.5.3",
    "numpy==2.4.3",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "pyyaml==6.0.3",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "starlette==1.0.0",
    "threadpoolctl==3.6.0",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "umap-learn==0.5.12",
    "uvicorn==0.42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.15.14",
    "ty>=0.0.39",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.28.0",  # required by fastapi.testclient
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --cov --cov-report=term-missing"

[tool.coverage.run]
source = ["."]
branch = true
omit = ["tests/*", ".venv/*", "**/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
