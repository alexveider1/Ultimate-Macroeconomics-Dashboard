name: Ultimate_Macroeconomics_Dashboard

services:

  db:
    image: postgres:18
    restart: unless-stopped
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Consumed only by the /docker-entrypoint-initdb.d bootstrap (below) to create
      # the `langfuse` role + database on first volume init — the self-hosted
      # Langfuse stack now shares this Postgres instead of its own container.
      LANGFUSE_POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD}
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
      # One-time (fresh-volume) bootstrap: create the langfuse role + database so
      # Langfuse can share this server. Postgres runs these before opening the
      # network port, so the DB exists before langfuse_web connects.
      - ./_container_data/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  vector_db:
    image: qdrant/qdrant:v1.17
    restart: unless-stopped
    container_name: qdrant_db
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT__SERVICE__API_KEY}
    ports:
      - 6333:6333
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s

  downloader_general:
    build:
      context: downloader_general
      dockerfile: Dockerfile
    container_name: downloader_general
    # Long-running now: after the one-shot initial ingest it stays up to run the
    # per-source incremental update scheduler (config.yaml `scheduler`).
    restart: unless-stopped
    tty: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_LLM_USER: ${POSTGRES_LLM_USER}
      POSTGRES_LLM_PASSWORD: ${POSTGRES_LLM_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FRED_API_KEY: ${FRED_API_KEY}
      QDRANT__SERVICE__API_KEY: ${QDRANT__SERVICE__API_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
      vector_db:
        condition: service_healthy
    volumes:
      - ./_container_data/config.yaml:/app/config.yaml:ro
      - ./_container_data/database_schema.yaml:/app/database_schema.yaml:ro
      - ./_container_data/_configs:/app/_configs
      - ./_container_data/downloader_general:/app/_container_data
    # Healthy once the one-shot initial ingest has written its marker. Dependents
    # wait on `service_healthy` (not `service_completed_successfully`) because the
    # container no longer exits — it stays up running the update scheduler. The
    # long start_period covers the ~1–2h first ingest without flapping.
    healthcheck:
      test: [ "CMD-SHELL", "test -f /app/_container_data/.download_completed" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 7200s

  agent:
    build:
      context: agent
      dockerfile: Dockerfile
    container_name: agent
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      QDRANT__SERVICE__API_KEY: ${QDRANT__SERVICE__API_KEY}
      POSTGRES_LLM_USER: ${POSTGRES_LLM_USER}
      POSTGRES_LLM_PASSWORD: ${POSTGRES_LLM_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
    ports:
      - 8000:8000
    depends_on:
      db:
        condition: service_healthy
      vector_db:
        condition: service_healthy
      downloader_general:
        condition: service_healthy
      downloader_extra:
        condition: service_healthy
    volumes:
      - ./_container_data/config.yaml:/app/config.yaml:ro
      - ./_container_data/database_schema.yaml:/app/database_schema.yaml:ro
      - ./_container_data/_configs:/app/_configs:ro
      - ./_container_data/agent:/app/_container_data
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)" ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s

  triton:
    build:
      context: triton
      dockerfile: Dockerfile
    container_name: triton
    restart: unless-stopped
    # GPU is required: Chronos + XGBoost run on CUDA and clustering uses cuML.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    # Triton's python backend shuttles tensors through /dev/shm; the 64MB Docker
    # default is far too small, so give it room.
    shm_size: "2gb"
    volumes:
      # Read by the Chronos model to resolve its checkpoint name (single source
      # of truth); nothing else in Triton reads config.yaml.
      - ./_container_data/config.yaml:/app/config.yaml:ro
      # Persist the Hugging Face weight cache so Chronos isn't re-downloaded on
      # every container restart.
      - triton_hf_cache:/root/.cache/huggingface
    # Ports (HTTP 8000 / gRPC 8001 / metrics 8002 + OpenAI 9000) stay internal to
    # the compose network — the adapters reach Triton over gRPC, and the docling
    # service reaches the OpenAI frontend at triton:9000, both by container name.
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/v2/health/ready', timeout=3).status == 200 else 1)" ]
      interval: 30s
      timeout: 5s
      retries: 30
      # First boot pip-loads RAPIDS/torch, downloads Chronos + granite-docling
      # weights, and inits every model (incl. the vLLM engine) — allow a long
      # ramp before marking healthy.
      start_period: 900s

  forecaster:
    build:
      context: forecaster
      dockerfile: Dockerfile
    container_name: forecaster
    restart: unless-stopped
    ports:
      - 8001:8001
    depends_on:
      db:
        condition: service_healthy
      vector_db:
        condition: service_healthy
      downloader_general:
        condition: service_healthy
      triton:
        condition: service_healthy
    volumes:
      - ./_container_data/config.yaml:/app/config.yaml:ro
      - ./_container_data/forecaster:/app/_container_data
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health', timeout=3).status == 200 else 1)" ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

  clustering:
    build:
      context: clustering
      dockerfile: Dockerfile
    container_name: clustering
    restart: unless-stopped
    ports:
      - 8002:8002
    depends_on:
      db:
        condition: service_healthy
      vector_db:
        condition: service_healthy
      downloader_general:
        condition: service_healthy
      triton:
        condition: service_healthy
    volumes:
      - ./_container_data/config.yaml:/app/config.yaml:ro
      - ./_container_data/clustering:/app/_container_data
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health', timeout=3).status == 200 else 1)" ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s

  downloader_extra:
    build:
      context: downloader_extra
      dockerfile: Dockerfile
    container_name: downloader_extra
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      FRED_API_KEY: ${FRED_API_KEY}
    ports:
      - 8003:8003
    depends_on:
      db:
        condition: service_healthy
      vector_db:
        condition: service_healthy
      downloader_general:
        condition: service_healthy
    volumes:
      - ./_container_data/config.yaml:/app/config.yaml:ro
      - ./_container_data/downloader_extra:/app/_container_data
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8003/health', timeout=3).status == 200 else 1)" ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s

  python_sandbox:
    build:
      context: python_sandbox
      dockerfile: Dockerfile
    container_name: python_sandbox
    restart: unless-stopped
    ports:
      - 8004:8004
    depends_on:
      db:
        condition: service_healthy
      vector_db:
        condition: service_healthy
      downloader_general:
        condition: service_healthy
    volumes:
      - ./_container_data/config.yaml:/app/config.yaml:ro
      - ./_container_data/python_sandbox:/app/_container_data
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8004/health', timeout=3).status == 200 else 1)" ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s

  bff:
    build:
      context: bff
      dockerfile: Dockerfile
    container_name: bff
    restart: unless-stopped
    # Read-only backend-for-frontend: the read-only LLM Postgres role (never the
    # superuser) + Qdrant key + OpenAI key (news-query embeddings only).
    environment:
      POSTGRES_LLM_USER: ${POSTGRES_LLM_USER}
      POSTGRES_LLM_PASSWORD: ${POSTGRES_LLM_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      QDRANT__SERVICE__API_KEY: ${QDRANT__SERVICE__API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
    ports:
      - 8005:8005
    depends_on:
      db:
        condition: service_healthy
      vector_db:
        condition: service_healthy
      downloader_general:
        condition: service_healthy
    volumes:
      - ./_container_data/config.yaml:/app/config.yaml:ro
      - ./_container_data/ui_themes.yaml:/app/ui_themes.yaml:ro
      - ./_container_data/_configs:/app/_configs:ro
      - ./_container_data/bff:/app/_container_data
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8005/health', timeout=3).status == 200 else 1)" ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s

  docling:
    build:
      context: docling
      dockerfile: Dockerfile
    container_name: docling
    restart: unless-stopped
    # Converts document uploads to Markdown for the BFF multimodal chat. Holds no
    # secrets — PDF VLM inference is offloaded to the keyless internal Triton
    # OpenAI endpoint (triton:9000); Office formats parse locally.
    ports:
      - 8006:8006
    depends_on:
      triton:
        condition: service_healthy
    volumes:
      - ./_container_data/config.yaml:/app/config.yaml:ro
      - ./_container_data/docling:/app/_container_data
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8006/health', timeout=3).status == 200 else 1)" ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s

  backup:
    build:
      context: backup
      dockerfile: Dockerfile
    container_name: backup
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      QDRANT__SERVICE__API_KEY: ${QDRANT__SERVICE__API_KEY}
    depends_on:
      db:
        condition: service_healthy
      vector_db:
        condition: service_healthy
    volumes:
      - ./_container_data/config.yaml:/app/config.yaml:ro
      - ./_container_data/backup:/app/_container_data

  # --- Frontend (React + Vite SPA served by nginx) ---------------------------
  # TypeScript React SPA consuming the read-only BFF via nginx's /api reverse
  # proxy (same-origin, no CORS). Sole dashboard frontend (replaced the Streamlit
  # `app` at the Phase-6 cutover). Host 3002 (3000=langfuse_web, 3001=grafana).
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - 3002:80
    depends_on:
      bff:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Langfuse (LLM tracing / observability, self-hosted) -------------------
  # Independent observability stack. Core services (agent / downloader_general /
  # bff) emit traces to langfuse_web but intentionally do NOT depend_on it, so a
  # Langfuse outage never blocks the app — the SDK degrades to a no-op. Image
  # tags mirror Langfuse's official self-host compose (the server is the `:3`
  # line, versioned separately from the v4 Python SDK). Only langfuse_web is
  # published to the host (:3000 UI); the rest are internal to the network.
  langfuse_worker:
    image: langfuse/langfuse-worker:3
    container_name: langfuse_worker
    restart: unless-stopped
    depends_on: &langfuse-depends-on
      db:
        condition: service_healthy
      langfuse_clickhouse:
        condition: service_healthy
      langfuse_redis:
        condition: service_healthy
      langfuse_minio:
        condition: service_healthy
    environment: &langfuse-common-env
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD}@db:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "true"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
      NEXTAUTH_URL: http://localhost:3000
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse_clickhouse:9000
      CLICKHOUSE_URL: http://langfuse_clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse_redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_MEDIA_UPLOAD_EXTERNAL_ENDPOINT: http://localhost:9090

  langfuse_web:
    image: langfuse/langfuse:3
    container_name: langfuse_web
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    ports:
      - 3000:3000
    environment:
      <<: *langfuse-common-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      # Auto-provision an org + project + login on first boot so the project
      # keys in .env work immediately (no manual UI setup). Idempotent.
      LANGFUSE_INIT_ORG_ID: umd
      LANGFUSE_INIT_ORG_NAME: Ultimate Macro Dashboard
      LANGFUSE_INIT_PROJECT_ID: umd-agent
      LANGFUSE_INIT_PROJECT_NAME: macro-agent
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
    healthcheck:
      # Langfuse's Next.js server binds to the container's own hostname IP (not
      # 0.0.0.0 or loopback), so localhost / 127.0.0.1 both refuse — resolve the
      # hostname at runtime via CMD-SHELL.
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://$(hostname):3000/api/public/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s

  langfuse_clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: langfuse_clickhouse
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  langfuse_redis:
    image: redis:7-alpine
    container_name: langfuse_redis
    restart: unless-stopped
    command: --requirepass ${LANGFUSE_REDIS_AUTH} --maxmemory-policy noeviction
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${LANGFUSE_REDIS_AUTH} ping | grep -q PONG" ]
      interval: 5s
      timeout: 10s
      retries: 10

  langfuse_minio:
    image: minio/minio:latest
    container_name: langfuse_minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD}
    networks:
      default:
        # MinIO (>= 2025 releases) rejects any request whose Host header is not
        # an RFC-valid hostname with "InvalidRequest / invalid hostname" — and
        # the container name "langfuse_minio" contains an underscore, so every
        # S3 event/media upload from langfuse_web failed and no traces were
        # persisted. Expose a hyphenated alias the S3 endpoints target instead.
        aliases:
          - langfuse-minio
    ports:
      # API on 9090 (media presigned URLs), console on 9091.
      - 9090:9000
      - 9091:9001
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- External monitoring (Grafana + Prometheus + OpenTelemetry) ------------
  # Standalone metrics + health monitor, independent of the dashboard (mirrors
  # the Langfuse precedent): on the default bridge so it reaches internal-only
  # services (triton, langfuse_*) by name, with NO depends_on in either
  # direction — a monitor outage can never block or be blocked by the stack.
  # Replaces the former Netdata container. Every container is treated as an
  # external service: the OTel Collector reads the Docker socket for
  # per-container CPU/RAM/net/disk (ALL containers) + host metrics;
  # blackbox_exporter probes each service's health; Prometheus scrapes both
  # (+ Triton's native metrics); Grafana visualises. Fully FOSS, no paid tiers.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    container_name: otel-collector
    hostname: umd-otel-collector
    restart: unless-stopped
    command: [ "--config=/etc/otelcol-contrib/config.yaml" ]
    # Run as root so the docker_stats receiver can read the root-owned Docker
    # socket. The collector image is distroless (no shell), hence no healthcheck.
    user: "0:0"
    volumes:
      - ./_container_data/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      # docker_stats reads per-container metrics via the Docker Engine API over
      # the socket (moved here from the old netdata service).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # hostmetrics reads the host's /proc + /sys via this read-only root mount
      # (root_path: /hostfs in the collector config). No `rslave` — WSL2 mounts
      # the host root `private` (the same caveat the old netdata service noted).
      - /:/hostfs:ro

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    hostname: umd-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - 9092:9090 # UI/API (host 9090/9091 are taken by langfuse_minio)
    volumes:
      - ./_container_data/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  blackbox_exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox_exporter
    hostname: umd-blackbox
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./_container_data/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9115/-/healthy" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    hostname: umd-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - 3001:3000 # UI (host 3000 is taken by langfuse_web)
    volumes:
      # Datasource + dashboard-provider provisioning, and the dashboard JSONs.
      - ./_container_data/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./_container_data/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana # grafana.db + state
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 5s
      retries: 5
