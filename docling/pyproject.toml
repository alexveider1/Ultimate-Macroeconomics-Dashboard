[project]
name = "umd-docling"
version = "0.1.0"
description = "FastAPI service converting document uploads to Markdown via docling (PDF over the Triton-hosted VLM)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling==2.110.0",
    "fastapi==0.135.2",
    "uvicorn==0.42.0",
    "python-multipart==0.0.20",
    "pydantic==2.12.5",
    "pyyaml==6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.15.14",
    "ty>=0.0.39",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.28.0",  # required by fastapi.testclient
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --cov --cov-report=term-missing"

[tool.coverage.run]
source = ["."]
branch = true
omit = ["tests/*", ".venv/*", "**/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
