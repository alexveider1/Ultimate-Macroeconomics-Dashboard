server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets are content-hashed by Vite — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA client-side routing: everything else falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the API to the BFF. The trailing slash on proxy_pass strips
    # the /api prefix (so /api/config/theme -> bff:8005/config/theme).
    location /api/ {
        proxy_pass http://bff:8005/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE (agent chat streaming): disable buffering, keep the connection open.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
